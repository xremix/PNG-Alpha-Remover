<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG Alpha Remover</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="ambient-shape shape-a" aria-hidden="true"></div>
    <div class="ambient-shape shape-b" aria-hidden="true"></div>
    <div class="ambient-shape shape-c" aria-hidden="true"></div>

    <main class="app">
        <div class="header">
            <div class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 9V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3m4-12v4m4-4v4M3 13h6m6 0h6M9 21l3-3 3 3"/></svg>
            </div>
            <div>
                <h1 class="headline">PNG Alpha Remover</h1>
            </div>
        </div>
        <p class="subline">Drop multiple images or click to select. Only PNG files are processed — each output keeps the original filename and downloads automatically.</p>

        <label class="drop-zone" id="dropZone" for="fileInput">
            <div class="drop-content">
                <div class="drop-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </div>
                <div class="drop-text">
                    <h2>Drop PNGs here</h2>
                    <p>or click to select files from your device</p>
                    <span class="hint">⚡ Instant processing &amp; automatic download</span>
                </div>
            </div>
        </label>

        <input class="sr-only" id="fileInput" type="file" accept="image/png,.png" multiple>

        <div class="status-row" aria-live="polite">
            <span class="chip" id="statusChip">Waiting for files…</span>
            <span class="chip" id="countChip">Processed: 0</span>
            <span class="chip" id="skipChip">Skipped: 0</span>
            <span class="chip error" id="errorChip" hidden>No errors</span>
        </div>

        <div class="list" id="resultList" hidden></div>
    </main>

   <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG Alpha Remover</title>
    <style>
        :root {
            --bg: #08110f;
            --surface: rgba(14, 24, 22, 0.85);
            --surface-strong: rgba(20, 33, 30, 0.95);
            --surface-hover: rgba(28, 44, 40, 0.9);
            --text: #e8e8f0;
            --muted: #7aa199;
            --accent: #2dd4bf;
            --accent-glow: rgba(45, 212, 191, 0.35);
            --accent-2: #67e8f9;
            --accent-2-glow: rgba(103, 232, 249, 0.32);
            --danger: #f26b6b;
            --border: rgba(255, 255, 255, 0.07);
            --border-accent: rgba(45, 212, 191, 0.4);
            --shadow: 0 32px 80px rgba(0, 0, 0, 0.7);
            --radius-xl: 24px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Space Grotesk", "Inter", "Avenir Next", "Segoe UI", sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        body {
            padding: 24px;
            overflow-x: hidden;
        }

        /* Animated background grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(45, 212, 191, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45, 212, 191, 0.05) 1px, transparent 1px);
            background-size: 48px 48px;
            z-index: -2;
            animation: gridPan 30s linear infinite;
        }

        @keyframes gridPan {
            0%   { background-position: 0 0; }
            100% { background-position: 48px 48px; }
        }

        /* Ambient orbs */
        .ambient-shape {
            position: fixed;
            border-radius: 999px;
            pointer-events: none;
            z-index: -1;
            animation: drift 18s ease-in-out infinite;
        }

        .shape-a {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle at 40% 40%, rgba(45, 212, 191, 0.22), transparent 70%);
            top: -180px;
            right: -160px;
            filter: blur(2px);
        }

        .shape-b {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle at 55% 55%, rgba(103, 232, 249, 0.18), transparent 70%);
            bottom: -160px;
            left: -140px;
            filter: blur(2px);
            animation-delay: -7s;
        }

        .shape-c {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle at 50% 50%, rgba(242, 107, 107, 0.1), transparent 70%);
            top: 40%;
            left: 55%;
            filter: blur(2px);
            animation-delay: -13s;
            animation-duration: 22s;
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); }
            33%       { transform: translateY(-20px) translateX(12px) scale(1.06); }
            66%       { transform: translateY(10px) translateX(-8px) scale(0.97); }
        }

        /* Card */
        .app {
            max-width: 860px;
            margin: 0 auto;
            background: var(--surface);
            backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow), 0 0 0 1px rgba(45, 212, 191, 0.1), inset 0 1px 0 rgba(255,255,255,0.06);
            padding: clamp(24px, 4vw, 40px);
            animation: reveal 500ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #5eead4);
            box-shadow: 0 0 20px var(--accent-glow);
            flex-shrink: 0;
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
            50%       { box-shadow: 0 0 36px rgba(45, 212, 191, 0.62); }
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }

        .headline {
            margin: 0 0 4px;
            font-size: clamp(1.5rem, 3.2vw, 2.1rem);
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #e8e8f0 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subline {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
            font-size: 0.95rem;
        }

        /* Drop zone */
        .drop-zone {
            display: block;
            margin-top: 28px;
            border: 1.5px dashed rgba(45, 212, 191, 0.4);
            border-radius: var(--radius-lg);
            background: linear-gradient(160deg, rgba(45, 212, 191, 0.06), rgba(103, 232, 249, 0.04));
            padding: clamp(32px, 5vw, 60px) clamp(20px, 4vw, 48px);
            text-align: center;
            transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 200ms ease,
                        background 200ms ease,
                        box-shadow 200ms ease;
            cursor: pointer;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .drop-zone::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(45, 212, 191, 0.12), transparent 65%);
            opacity: 0;
            transition: opacity 300ms ease;
        }

        .drop-zone:hover::before,
        .drop-zone.dragging::before {
            opacity: 1;
        }

        .drop-zone:hover {
            transform: translateY(-2px);
            border-color: rgba(45, 212, 191, 0.72);
            box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.14), 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .drop-zone.dragging {
            transform: translateY(-3px) scale(1.01);
            border-color: var(--accent-2);
            background: linear-gradient(160deg, rgba(103, 232, 249, 0.11), rgba(45, 212, 191, 0.08));
            box-shadow: 0 0 0 4px var(--accent-2-glow), 0 16px 48px rgba(0, 0, 0, 0.4);
        }

        .drop-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .drop-text {
            text-align: left;
        }

        .drop-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(45, 212, 191, 0.14);
            border: 1px solid rgba(45, 212, 191, 0.28);
            flex-shrink: 0;
            transition: transform 200ms ease, background 200ms ease;
        }

        .drop-zone:hover .drop-icon,
        .drop-zone.dragging .drop-icon {
            transform: scale(1.1);
            background: rgba(45, 212, 191, 0.24);
        }

        .drop-icon svg {
            width: 26px;
            height: 26px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .drop-zone h2 {
            margin: 0 0 4px;
            font-size: clamp(1.05rem, 2.4vw, 1.35rem);
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .drop-zone p {
            margin: 0 0 12px;
            color: var(--muted);
            line-height: 1.5;
            font-size: 0.9rem;
        }

        .drop-zone .hint {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
            background: rgba(45, 212, 191, 0.14);
            border: 1px solid rgba(45, 212, 191, 0.26);
            border-radius: 999px;
            padding: 4px 12px;
            transition: background 200ms ease;
        }

        .drop-zone:hover .hint {
            background: rgba(45, 212, 191, 0.22);
        }

        /* Status chips */
        .status-row {
            margin-top: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .chip {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 0.85rem;
            color: var(--muted);
            transition: color 200ms ease, border-color 200ms ease, background 200ms ease;
        }

        .chip.active {
            color: var(--accent);
            border-color: rgba(45, 212, 191, 0.42);
            background: rgba(45, 212, 191, 0.12);
        }

        .chip.error {
            border-color: rgba(242, 107, 107, 0.35);
            color: var(--danger);
            background: rgba(242, 107, 107, 0.08);
        }

        /* Result list */
        .list {
            margin-top: 18px;
            max-height: 260px;
            overflow: auto;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(8, 16, 14, 0.55);
            scrollbar-width: thin;
            scrollbar-color: rgba(45, 212, 191, 0.4) transparent;
        }

        .list::-webkit-scrollbar { width: 5px; }
        .list::-webkit-scrollbar-track { background: transparent; }
        .list::-webkit-scrollbar-thumb { background: rgba(45, 212, 191, 0.4); border-radius: 999px; }

        .list-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            opacity: 0;
            transform: translateX(-8px);
            animation: staggerIn 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: background 180ms ease;
        }

        .list-item:hover {
            background: rgba(45, 212, 191, 0.08);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        @keyframes staggerIn {
            to { opacity: 1; transform: translateX(0); }
        }

        .list-item .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
            color: var(--text);
        }

        .list-item .badge {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent-2);
            background: rgba(103, 232, 249, 0.14);
            border: 1px solid rgba(103, 232, 249, 0.28);
            border-radius: 999px;
            padding: 3px 10px;
            flex-shrink: 0;
        }

        .list-item .badge.skipped {
            color: var(--muted);
            background: rgba(102, 139, 132, 0.12);
            border-color: rgba(102, 139, 132, 0.24);
        }

        .list-item .badge.error {
            color: var(--danger);
            background: rgba(242, 107, 107, 0.1);
            border-color: rgba(242, 107, 107, 0.2);
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 28px 0 0;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 640px) {
            body { padding: 14px; }
            .app { border-radius: 18px; padding: 18px; }
            .drop-zone { padding: 28px 16px; }
        }
    </style>
</head>
<body>
    <div class="ambient-shape shape-a" aria-hidden="true"></div>
    <div class="ambient-shape shape-b" aria-hidden="true"></div>
    <div class="ambient-shape shape-c" aria-hidden="true"></div>

    <main class="app">
        <div class="header">
            <div class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 9V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3m4-12v4m4-4v4M3 13h6m6 0h6M9 21l3-3 3 3"/></svg>
            </div>
            <div>
                <h1 class="headline">PNG Alpha Remover</h1>
            </div>
        </div>
        <p class="subline">Drop multiple images or click to select. Only PNG files are processed — each output keeps the original filename and downloads automatically.</p>

        <label class="drop-zone" id="dropZone" for="fileInput">
            <div class="drop-content">
                <div class="drop-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </div>
                <div class="drop-text">
                    <h2>Drop PNGs here</h2>
                    <p>or click to select files from your device</p>
                    <span class="hint">⚡ Instant processing &amp; automatic download</span>
                </div>
            </div>
        </label>

        <input class="sr-only" id="fileInput" type="file" accept="image/png,.png" multiple>

        <div class="status-row" aria-live="polite">
            <span class="chip" id="statusChip">Waiting for files…</span>
            <span class="chip" id="countChip">Processed: 0</span>
            <span class="chip" id="skipChip">Skipped: 0</span>
            <span class="chip error" id="errorChip" hidden>No errors</span>
        </div>

        <div class="list" id="resultList" hidden></div>
    </main>

    <script>
        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");
        const statusChip = document.getElementById("statusChip");
        const countChip = document.getElementById("countChip");
        const skipChip = document.getElementById("skipChip");
        const errorChip = document.getElementById("errorChip");
        const resultList = document.getElementById("resultList");

        const counters = {
            processed: 0,
            skipped: 0,
            errors: 0,
        };

        ["dragenter", "dragover"].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                event.stopPropagation();
                dropZone.classList.add("dragging");
            });
        });

        ["dragleave", "drop"].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                event.stopPropagation();
                dropZone.classList.remove("dragging");
            });
        });

        dropZone.addEventListener("drop", async (event) => {
            const files = Array.from(event.dataTransfer?.files || []);
            await processFiles(files);
        });

        fileInput.addEventListener("change", async () => {
            const files = Array.from(fileInput.files || []);
            await processFiles(files);
            fileInput.value = "";
        });

        function updateChips(message) {
            statusChip.textContent = message;
            countChip.textContent = `Processed: ${counters.processed}`;
            skipChip.textContent = `Skipped: ${counters.skipped}`;

            if (counters.errors > 0) {
                errorChip.hidden = false;
                errorChip.textContent = `Errors: ${counters.errors}`;
            } else {
                errorChip.hidden = true;
            }
        }

        function addListItem(name, state) {
            resultList.hidden = false;
            const item = document.createElement("div");
            item.className = "list-item";

            const fileName = document.createElement("span");
            fileName.className = "name";
            fileName.textContent = name;

            const badge = document.createElement("span");
            badge.className = "badge";
            if (state === "Skipped") badge.classList.add("skipped");
            if (state === "Error") badge.classList.add("error");
            badge.textContent = state;

            item.append(fileName, badge);
            resultList.prepend(item);
        }

        async function processFiles(files) {
            if (files.length === 0) {
                return;
            }

            updateChips(`Processing ${files.length} file(s)...`);

            for (const file of files) {
                if (!isPng(file)) {
                    counters.skipped += 1;
                    addListItem(file.name, "Skipped");
                    continue;
                }

                try {
                    const blob = await removeAlpha(file);
                    downloadBlob(blob, file.name);
                    counters.processed += 1;
                    addListItem(file.name, "Downloaded");
                } catch (error) {
                    counters.errors += 1;
                    addListItem(file.name, "Error");
                    console.error(`Failed to process ${file.name}`, error);
                }
            }

            updateChips("Done. Drop more files anytime.");
        }

        function isPng(file) {
            const typeMatch = file.type.toLowerCase() === "image/png";
            const nameMatch = file.name.toLowerCase().endsWith(".png");
            return typeMatch || nameMatch;
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error("Could not read image"));
                image.src = URL.createObjectURL(file);
            });
        }

        async function removeAlpha(file) {
            const image = await loadImage(file);

            const canvas = document.createElement("canvas");
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;

            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            if (!ctx) {
                throw new Error("Canvas 2D context not supported");
            }

            ctx.drawImage(image, 0, 0);
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = frame.data;

            // Blend pixels over white and force full opacity.
            for (let i = 0; i < pixels.length; i += 4) {
                const alpha = pixels[i + 3] / 255;
                pixels[i] = Math.round((pixels[i] * alpha) + (255 * (1 - alpha)));
                pixels[i + 1] = Math.round((pixels[i + 1] * alpha) + (255 * (1 - alpha)));
                pixels[i + 2] = Math.round((pixels[i + 2] * alpha) + (255 * (1 - alpha)));
                pixels[i + 3] = 255;
            }

            ctx.putImageData(frame, 0, 0);

            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => {
                    if (!blob) {
                        reject(new Error("PNG export failed"));
                        return;
                    }
                    resolve(blob);
                }, "image/png");
            });
        }

        function downloadBlob(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>

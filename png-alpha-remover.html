<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG Alpha Remover</title>
    <style>
        :root {
            --bg-top: #fef8ef;
            --bg-bottom: #d7e4ff;
            --surface: rgba(255, 255, 255, 0.78);
            --surface-strong: rgba(255, 255, 255, 0.94);
            --text: #132238;
            --muted: #5f6d80;
            --accent: #0b7fdb;
            --accent-2: #19a974;
            --danger: #b74a4a;
            --border: rgba(19, 34, 56, 0.12);
            --shadow: 0 24px 60px rgba(7, 19, 43, 0.16);
            --radius-xl: 24px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
            color: var(--text);
            background: linear-gradient(155deg, var(--bg-top), var(--bg-bottom));
        }

        body {
            padding: 24px;
        }

        .ambient-shape {
            position: fixed;
            border-radius: 999px;
            pointer-events: none;
            filter: blur(4px);
            opacity: 0.48;
            z-index: -1;
            animation: drift 14s ease-in-out infinite;
        }

        .shape-a {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle at 35% 30%, #ffffff, #7ec9ff);
            top: -70px;
            right: -60px;
        }

        .shape-b {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle at 60% 40%, #ffffff, #9de5b8);
            bottom: -90px;
            left: -100px;
            animation-delay: -4s;
        }

        @keyframes drift {
            0%,
            100% {
                transform: translateY(0) translateX(0) scale(1);
            }
            50% {
                transform: translateY(-14px) translateX(8px) scale(1.05);
            }
        }

        .app {
            max-width: 860px;
            margin: 0 auto;
            background: var(--surface);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            padding: clamp(20px, 4vw, 34px);
            animation: reveal 460ms ease;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .headline {
            margin: 0 0 6px;
            font-size: clamp(1.6rem, 3.4vw, 2.35rem);
            letter-spacing: -0.02em;
        }

        .subline {
            margin: 0;
            color: var(--muted);
            line-height: 1.45;
        }

        .drop-zone {
            margin-top: 24px;
            border: 2px dashed rgba(11, 127, 219, 0.4);
            border-radius: var(--radius-lg);
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.9), rgba(231, 241, 255, 0.72));
            padding: clamp(28px, 5vw, 52px);
            text-align: center;
            transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
            cursor: pointer;
            user-select: none;
        }

        .drop-zone.dragging {
            transform: translateY(-2px) scale(1.01);
            border-color: var(--accent-2);
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.95), rgba(218, 248, 231, 0.9));
        }

        .drop-zone h2 {
            margin: 0 0 10px;
            font-size: clamp(1.2rem, 2.7vw, 1.6rem);
        }

        .drop-zone p {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .drop-zone .hint {
            display: inline-block;
            margin-top: 16px;
            color: var(--accent);
            font-weight: 700;
        }

        .status-row {
            margin-top: 18px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .chip {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.92rem;
        }

        .chip.error {
            border-color: rgba(183, 74, 74, 0.4);
            color: var(--danger);
        }

        .list {
            margin-top: 16px;
            max-height: 250px;
            overflow: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.65);
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 11px 14px;
            border-bottom: 1px solid rgba(19, 34, 56, 0.08);
            opacity: 0;
            transform: translateY(4px);
            animation: staggerIn 280ms ease forwards;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        @keyframes staggerIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .list-item .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.94rem;
        }

        .list-item .badge {
            font-size: 0.78rem;
            font-weight: 700;
            color: #085a9a;
            background: rgba(11, 127, 219, 0.14);
            border-radius: 999px;
            padding: 4px 8px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 640px) {
            body {
                padding: 14px;
            }

            .app {
                border-radius: 18px;
                padding: 16px;
            }

            .drop-zone {
                padding: 22px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-shape shape-a" aria-hidden="true"></div>
    <div class="ambient-shape shape-b" aria-hidden="true"></div>

    <main class="app">
        <h1 class="headline">PNG Alpha Remover</h1>
        <p class="subline">Drop multiple images or click once. Only PNG files are processed. Each output keeps the exact original file name and downloads automatically.</p>

        <label class="drop-zone" id="dropZone" for="fileInput">
            <h2>Drag & Drop PNGs Here</h2>
            <p>or click to select files</p>
            <span class="hint">Instant processing + automatic download</span>
        </label>

        <input class="sr-only" id="fileInput" type="file" accept="image/png,.png" multiple>

        <div class="status-row" aria-live="polite">
            <span class="chip" id="statusChip">Waiting for files</span>
            <span class="chip" id="countChip">Processed: 0</span>
            <span class="chip" id="skipChip">Skipped: 0</span>
            <span class="chip error" id="errorChip" hidden>No errors</span>
        </div>

        <div class="list" id="resultList" hidden></div>
    </main>

    <script>
        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");
        const statusChip = document.getElementById("statusChip");
        const countChip = document.getElementById("countChip");
        const skipChip = document.getElementById("skipChip");
        const errorChip = document.getElementById("errorChip");
        const resultList = document.getElementById("resultList");

        const counters = {
            processed: 0,
            skipped: 0,
            errors: 0,
        };

        ["dragenter", "dragover"].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                event.stopPropagation();
                dropZone.classList.add("dragging");
            });
        });

        ["dragleave", "drop"].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                event.stopPropagation();
                dropZone.classList.remove("dragging");
            });
        });

        dropZone.addEventListener("drop", async (event) => {
            const files = Array.from(event.dataTransfer?.files || []);
            await processFiles(files);
        });

        fileInput.addEventListener("change", async () => {
            const files = Array.from(fileInput.files || []);
            await processFiles(files);
            fileInput.value = "";
        });

        function updateChips(message) {
            statusChip.textContent = message;
            countChip.textContent = `Processed: ${counters.processed}`;
            skipChip.textContent = `Skipped: ${counters.skipped}`;

            if (counters.errors > 0) {
                errorChip.hidden = false;
                errorChip.textContent = `Errors: ${counters.errors}`;
            } else {
                errorChip.hidden = true;
            }
        }

        function addListItem(name, state) {
            resultList.hidden = false;
            const item = document.createElement("div");
            item.className = "list-item";

            const fileName = document.createElement("span");
            fileName.className = "name";
            fileName.textContent = name;

            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = state;

            item.append(fileName, badge);
            resultList.prepend(item);
        }

        async function processFiles(files) {
            if (files.length === 0) {
                return;
            }

            updateChips(`Processing ${files.length} file(s)...`);

            for (const file of files) {
                if (!isPng(file)) {
                    counters.skipped += 1;
                    addListItem(file.name, "Skipped");
                    continue;
                }

                try {
                    const blob = await removeAlpha(file);
                    downloadBlob(blob, file.name);
                    counters.processed += 1;
                    addListItem(file.name, "Downloaded");
                } catch (error) {
                    counters.errors += 1;
                    addListItem(file.name, "Error");
                    console.error(`Failed to process ${file.name}`, error);
                }
            }

            updateChips("Done. Drop more files anytime.");
        }

        function isPng(file) {
            const typeMatch = file.type.toLowerCase() === "image/png";
            const nameMatch = file.name.toLowerCase().endsWith(".png");
            return typeMatch || nameMatch;
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error("Could not read image"));
                image.src = URL.createObjectURL(file);
            });
        }

        async function removeAlpha(file) {
            const image = await loadImage(file);

            const canvas = document.createElement("canvas");
            canvas.width = image.naturalWidth;
            canvas.height = image.naturalHeight;

            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            if (!ctx) {
                throw new Error("Canvas 2D context not supported");
            }

            ctx.drawImage(image, 0, 0);
            const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = frame.data;

            // Blend pixels over white and force full opacity.
            for (let i = 0; i < pixels.length; i += 4) {
                const alpha = pixels[i + 3] / 255;
                pixels[i] = Math.round((pixels[i] * alpha) + (255 * (1 - alpha)));
                pixels[i + 1] = Math.round((pixels[i + 1] * alpha) + (255 * (1 - alpha)));
                pixels[i + 2] = Math.round((pixels[i + 2] * alpha) + (255 * (1 - alpha)));
                pixels[i + 3] = 255;
            }

            ctx.putImageData(frame, 0, 0);

            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => {
                    if (!blob) {
                        reject(new Error("PNG export failed"));
                        return;
                    }
                    resolve(blob);
                }, "image/png");
            });
        }

        function downloadBlob(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
